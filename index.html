<h1>Obsidian Backup</h1>
<p>Obsidian Backupは、個人が自分のMac上のObsidianのメモを、自分のGoogleドライブへバックアップするための個人用ツールです。</p>
<h2>このツールについて</h2>
<ul>
<li>利用者は開発者本人のみです。</li>
<li>メモは、本人のMacから本人のGoogleドライブへ直接保存されます。</li>
<li>Googleドライブへのアクセス権限は、drive.file のみを使用します。</li>
</ul>
<p><a href="privacy.html">プライバシーポリシー</a></p>
